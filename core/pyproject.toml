[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mumomac-toolkit"
version = "0.3.0"
description = "Exploratory macrophage RNA program profiling with frozen MuMoMac signatures"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-MuMoMac-Internal-Research"
license-files = ["INTERNAL_NOTICE.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = ["anndata>=0.10", "numpy>=1.23", "scipy>=1.10", "pandas>=2.0", "pyucell==0.8.0"]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1"]
report = ["matplotlib>=3.8"]

[project.scripts]
mumomac = "mumomac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mumomac.resources" = ["*.tsv", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
